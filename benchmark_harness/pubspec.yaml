name: auraf_benchmark_harness
description: AURAF Milestone 2 benchmark harness - live State Collector, SQLite telemetry log and the automated 4x3x2 benchmark matrix.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  auraf:
    path: ../packages/auraf
  flutter:
    sdk: flutter
  path: ^1.8.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
